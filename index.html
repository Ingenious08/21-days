<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>🌿 Wellness Journey</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;background:#f6f2ec}
body{font-family:'Poppins',sans-serif;color:#2e2a28}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#d0c8bc;border-radius:2px}
.app{min-height:100vh;background:#f6f2ec;max-width:430px;margin:0 auto}
/* HEADER */
.hdr{background:linear-gradient(145deg,#e8f2ec 0%,#eee8f8 55%,#fdeae0 100%);padding:20px 18px 16px;border-bottom:1px solid #e0dcd4}
.hdr-inner{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.hdr-greet{font-size:12px;color:#7a9484;font-weight:500;margin-bottom:2px}
.hdr-title{font-size:21px;font-weight:700;color:#2e2a28;letter-spacing:-.4px;line-height:1.2}
.hdr-sub{font-size:11px;color:#9a9490;margin-top:3px}
.hdr-badges{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.bdg{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.bdg-s{background:#fff8e6;color:#c07a50;border:1px solid #e8c890}
.bdg-p{background:#e8f2ec;color:#5a8a6a;border:1px solid #a8d4b4}
.hpb{height:6px;background:rgba(255,255,255,.5);border-radius:3px;overflow:hidden;margin-bottom:4px}
.hpf{height:100%;border-radius:3px;background:linear-gradient(90deg,#7abf94,#a894d0);transition:width .7s ease}
.hpl{display:flex;justify-content:space-between;font-size:10px;color:#9a9490}
/* NAV */
.nav{display:flex;background:#fff;border-bottom:1px solid #e8e2da;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 9px;background:none;border:none;color:#b4a89e;font-family:'Poppins',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:all .2s;border-bottom:2px solid transparent}
.nb:hover{color:#6e6860}
.ne{font-size:16px;line-height:1}
.nb.on{color:#6d9e84;border-bottom-color:#6d9e84;font-weight:600}
/* MAIN */
.main{padding:16px 14px 56px}
.ani{animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* DAY NAV */
.dnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.arr{width:38px;height:38px;border-radius:50%;border:1px solid #e0dcd4;background:#fff;color:#a0988e;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 1px 5px rgba(0,0,0,.06);line-height:1}
.arr:hover:not(:disabled){border-color:#6d9e84;color:#6d9e84}
.arr:disabled{opacity:.25;cursor:not-allowed}
.dctr{text-align:center;flex:1}
.dnr{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:2px;flex-wrap:wrap}
.dnum{font-size:20px;font-weight:700;color:#2e2a28}
.ddate{font-size:11px;color:#9a9490}
.chip{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.3px}
.ct{background:#6d9e84;color:#fff}
.cpa{background:#eaf4ee;color:#6d9e84;border:1px solid #a8d4b4}
.cf{background:#fdeae0;color:#c07a50;border:1px solid #e8c090}
/* DAY PROGRESS CARD */
.dpc{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.05);border:1px solid #ede8e0}
.dpr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dpl{font-size:12px;color:#9a9490}
.dpp{font-size:14px;font-weight:700}
.pb{height:8px;background:#f0ece4;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .5s ease}
.pm{font-size:12px;font-weight:600;text-align:center;margin-top:8px}
/* TASK GROUPS */
.tgrp{margin-bottom:22px}
.clbl{font-size:9.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;padding-left:2px}
/* TASK CARD */
.tc{background:#fff;border:1px solid #ede8e0;border-radius:16px;margin-bottom:8px;display:flex;align-items:center;overflow:hidden;flex-wrap:wrap;box-shadow:0 1px 6px rgba(0,0,0,.04);transition:box-shadow .2s,transform .15s;cursor:pointer;user-select:none}
.tc:active{transform:scale(.98)}
.tc:hover{box-shadow:0 4px 18px rgba(0,0,0,.08)}
.tc.done{background:#fafdf8;border-color:#cce8d4}

.tcb{width:4px;align-self:stretch;flex-shrink:0}
.tci{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;margin:12px 0 12px 10px}
.tbd{flex:1;padding:12px 0;min-width:0}
.tn{font-size:13px;font-weight:600;color:#2e2a28;line-height:1.3}
.tn.x{color:#6d9e84;text-decoration:line-through;text-decoration-color:#a8d4b480}
.ts{font-size:11px;color:#b4a89e;margin-top:1px}
.tck{width:26px;height:26px;border-radius:50%;border:2px solid #d8d0c8;margin-right:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;transition:all .2s}
.mr{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.pill{font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid #ddd8d0;background:#faf8f4;color:#9a9490;cursor:pointer;transition:all .15s;font-family:'Poppins',sans-serif;font-weight:500}
.pill:hover{border-color:#a8a09a}
/* EXPAND PANEL */
.ep{width:100%;border-top:1px solid #f0ece4;padding:14px;background:#fdfbf7}
.es{margin-bottom:14px}
.et{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#a89e94;margin-bottom:8px}
.sr{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #f0ece4;font-size:13px;color:#3a3535;cursor:pointer;transition:opacity .1s}
.sr:first-of-type{border-top:none}
.sr:hover{opacity:.65}
.mc{width:20px;height:20px;border-radius:50%;border:1.5px solid #d0c8c0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;transition:all .2s}
.pw{display:flex;flex-wrap:wrap;gap:6px}
.mb{display:block;width:100%;background:none;border:none;font-size:12px;font-weight:600;text-align:center;cursor:pointer;margin-top:12px;padding:9px;border-radius:10px;transition:background .15s;font-family:'Poppins',sans-serif}
.mb:hover{background:#f0ece4}
/* FUTURE */
.fb{text-align:center;padding:52px 20px;color:#b4a89e}
.ft{font-size:16px;font-weight:700;color:#6e6860;margin-bottom:6px}
/* CALENDAR */
.stl{font-size:17px;font-weight:700;color:#2e2a28;margin-bottom:13px}
.leg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:#9a9490}
.ld{width:9px;height:9px;border-radius:50%}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.ch{text-align:center;font-size:9px;font-weight:700;color:#b4a89e;padding:5px 0;letter-spacing:.5px}
.ce{aspect-ratio:1}
.cc{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid;padding:2px;transition:transform .15s,box-shadow .15s;position:relative}
.clk:hover{transform:scale(1.06);box-shadow:0 4px 14px rgba(0,0,0,.1);cursor:pointer}
.cnow{box-shadow:0 0 0 2px #6d9e84,0 3px 10px rgba(109,158,132,.25)}
.cdn{font-size:14px;font-weight:700;line-height:1}
.cnd{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#6d9e84}
.cmb{width:75%;height:2px;background:#e8e0d4;border-radius:1px;margin-top:2px}
.cmf{height:100%;border-radius:1px}
.ctip{background:#fff;border:1px solid #e0dcd4;border-radius:10px;padding:8px 12px;font-size:11px;color:#6e6860;margin-bottom:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.csum{display:flex;justify-content:space-around;background:#fff;border-radius:16px;border:1px solid #e8e2da;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.si{display:flex;flex-direction:column;align-items:center;gap:4px}
.sn{font-size:26px;font-weight:800;line-height:1}
.sl{font-size:10px;color:#9a9490}
/* PROGRESS */
.pv{display:flex;flex-direction:column;gap:12px}
.ph{background:linear-gradient(145deg,#eaf4ee 0%,#eee8f8 100%);border-radius:20px;padding:24px 20px;text-align:center;border:1px solid #ddd8ec}
.pb2{font-size:60px;font-weight:800;line-height:1;margin-bottom:4px}
.psub{font-size:12px;color:#9a9490;margin-bottom:16px}
.phr{display:flex;justify-content:space-around}
.pm2{display:flex;flex-direction:column;align-items:center;gap:2px}
.pmi{font-size:20px}
.pmv{font-size:18px;font-weight:700;color:#2e2a28}
.pml{font-size:10px;color:#9a9490}
.pcard{background:#fff;border-radius:16px;border:1px solid #ede8e0;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.pct{font-size:12px;font-weight:700;color:#2e2a28;margin-bottom:13px}
.crow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.crl{width:78px;font-size:11px;font-weight:600;flex-shrink:0}
.cb{flex:1;height:8px;background:#f0ece4;border-radius:4px;overflow:hidden}
.cbf{height:100%;border-radius:4px;transition:width .5s ease}
.cbp{width:34px;text-align:right;font-size:11px;font-weight:600;color:#9a9490}
.hr2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hi{font-size:18px;flex-shrink:0}
.hif{flex:1;min-width:0}
.hl{font-size:12px;font-weight:500;color:#3a3535;display:block;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{height:5px;background:#f0ece4;border-radius:3px;overflow:hidden}
.hbf{height:100%;border-radius:3px;transition:width .4s ease}
.hpc{width:32px;text-align:right;font-size:11px;font-weight:600;color:#9a9490}
.nn{font-size:11px;color:#c06888;font-style:italic;text-align:center;margin-top:12px;line-height:1.5}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spi{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:12px;border:1px solid;text-align:center}
/* PREVIOUS JOURNEY */
.prev-card{border-color:#ddd8ec;background:linear-gradient(145deg,#faf8fe,#f8faf8)}
.prev-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.prev-stat{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border-radius:10px;padding:10px 4px;border:1px solid #ede8e0}
.prev-num{font-size:20px;font-weight:800;line-height:1}
.prev-lbl{font-size:9px;color:#9a9490;text-align:center}
.prev-bar-bg{height:6px;background:#ede8e0;border-radius:3px;overflow:hidden;margin-bottom:8px}
.prev-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#8878c0,#a894d0)}
.prev-note{font-size:11px;color:#8878c0;font-style:italic;text-align:center;line-height:1.5}
/* WISH JAR */
.jar-outer{position:relative;width:68px;height:106px;flex-shrink:0}
.jar-lid{position:absolute;top:0;left:-5px;right:-5px;height:17px;background:linear-gradient(180deg,#d4c8b0,#c0b49a);border-radius:6px;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.jar-body{position:absolute;top:14px;left:0;right:0;bottom:0;border:1.5px solid #d0c8bc;border-radius:5px 5px 13px 13px;background:rgba(255,255,255,0.75);overflow:hidden}
.jar-liq{position:absolute;bottom:0;left:0;right:0;transition:height .6s ease}
.jar-line{position:absolute;left:0;right:0;top:30%;height:1px;background:#c06888;opacity:.55}
.jar-linelbl{position:absolute;right:4px;top:calc(30% - 8px);font-size:7px;color:#c06888;font-weight:700}
.jar-shine{position:absolute;left:8px;top:4px;bottom:8px;width:3px;background:rgba(255,255,255,.4);border-radius:2px}
.wish-inp{width:100%;padding:10px 14px;border:1px solid #e0dcd4;border-radius:12px;font-size:13px;font-family:'Poppins',sans-serif;background:#fff;outline:none;color:#2e2a28;transition:border-color .2s}
.wish-inp:focus{border-color:#6d9e84}
.wish-inp.uld{border-color:#a8d4b4;background:#f4fdf6}
/* FINAL REPORT */
.fw{padding:20px 14px 56px}
.fh{background:linear-gradient(145deg,#e8f4ee,#ede8f8,#fdeae0);border-radius:20px;padding:28px 20px;text-align:center;margin-bottom:16px;border:1px solid #d8d0e8}
.ft2{font-size:22px;font-weight:800;color:#2e2a28;margin-bottom:6px}
.fs2{font-size:13px;color:#6e6860;line-height:1.7}
.fsg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.fsc{background:#fff;border-radius:14px;padding:14px;text-align:center;border:1px solid #ede8e0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.fsn{font-size:28px;font-weight:800}
.fsl{font-size:10px;color:#9a9490;margin-top:3px}
/* POPUPS */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ob{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:320px;width:100%;position:relative;overflow:hidden;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.obg-cel{position:absolute;inset:0;background:linear-gradient(145deg,#eaf4ee,#f0ebfc);z-index:0}
.obg-gk{position:absolute;inset:0;background:linear-gradient(145deg,#fefae6,#fff8f0);z-index:0}
.ocnt{position:relative;z-index:1}
.otl{font-size:20px;font-weight:800;color:#2e2a28;margin-bottom:8px}
.omsg{font-size:13px;color:#6e6860;line-height:1.6;margin-bottom:18px}
.obtn{background:linear-gradient(135deg,#6d9e84,#8878c0);color:#fff;border:none;border-radius:100px;padding:11px 28px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;transition:transform .15s;width:100%}
.obtn:hover{transform:scale(1.02)}
.gk-theme{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;background:#fff8e6;color:#c07a50;border:1px solid #e8c890;margin-bottom:12px;letter-spacing:.3px}
.gk-emoji{font-size:44px;margin-bottom:10px;display:block}
.gk-q{font-size:14px;font-weight:700;color:#2e2a28;margin-bottom:10px;line-height:1.4}
.gk-div{height:1px;background:#f0ece4;margin:12px 0}
.gk-a{font-size:12px;color:#5a5450;line-height:1.6;margin-bottom:18px;text-align:left;background:#fdf9f0;border-radius:10px;padding:10px 12px;border-left:3px solid #c07a50}
.gk-day{font-size:10px;color:#b4a89e;margin-bottom:14px}
.obtn-gk{background:linear-gradient(135deg,#c07a50,#e8a060);color:#fff;border:none;border-radius:100px;padding:11px 28px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;transition:transform .15s;width:100%}
.obtn-gk:hover{transform:scale(1.02)}
@keyframes cf{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(60px) rotate(360deg);opacity:0}}
/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:11px 24px;border-radius:100px;font-size:13px;font-weight:600;z-index:9999;background:#fff;border:1px solid #a8d4b4;color:#4a7a5a;box-shadow:0 6px 24px rgba(0,0,0,.1);white-space:nowrap;max-width:88vw;font-family:'Poppins',sans-serif;animation:fadeUp .3s ease}
</style>

<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

/* ── CONSTANTS ── */
const START   = new Date("2026-07-25T00:00:00");
const DAYS    = 42;
const STORAGE = "wellness42_v2";
const OLD_KEY = "wellness21_v2";
const OIL     = new Set([1,4,7,10,13,16,19,22,25,28,31,34,37,40]);
const WASH    = new Set([2,5,8,11,14,17,20,23,26,29,32,35,38,41]);

/* ── GK FACTS  (42 facts · 6 weekly themes) ── */
const GK=[
  /* Week 1 · Countries 🌍 */
  {w:"🌍 Country Facts",e:"🇳🇴",q:"Which inhabited place has zero mosquitoes?",a:"Svalbard, Norway! Arctic conditions make it physically impossible for mosquitoes to survive — the only permanently inhabited place on Earth like this."},
  {w:"🌍 Country Facts",e:"🇨🇦",q:"Which country holds 60% of Earth's natural lakes?",a:"Canada — over 2 million lakes, more than the entire rest of the world combined!"},
  {w:"🌍 Country Facts",e:"🇨🇭",q:"Where is it illegal to own just ONE guinea pig?",a:"Switzerland! They're social animals — the law literally requires you keep at least two so they don't get lonely."},
  {w:"🌍 Country Facts",e:"🇫🇮",q:"Which country has more saunas than cars?",a:"Finland — 3.3 million saunas for 5.5 million people. Their parliament building even has one!"},
  {w:"🌍 Country Facts",e:"🇯🇵",q:"Japan has 1 vending machine per how many people?",a:"23 people — 5.5 million machines selling hot ramen, fresh eggs, umbrellas, even neckties!"},
  {w:"🌍 Country Facts",e:"🇮🇸",q:"Which country heats 90% of its homes from volcanoes?",a:"Iceland! Geothermal energy from underground volcanic heat powers almost the entire country — essentially free, clean energy."},
  {w:"🌍 Country Facts",e:"🇦🇺",q:"Australia is wider than which famous space object?",a:"The Moon! Australia spans ~4,000km wide while the Moon's diameter is only 3,474km."},
  /* Week 2 · Architecture 🏛️ */
  {w:"🏛️ Architecture",e:"🗼",q:"By how much does the Eiffel Tower grow every summer?",a:"15cm taller! Heat causes the iron to thermally expand. It shrinks right back in winter."},
  {w:"🏛️ Architecture",e:"🏙️",q:"How much can the Burj Khalifa actually sway at the top?",a:"Up to 2 meters in strong wind — intentionally engineered to flex rather than crack. Flexibility = safety!"},
  {w:"🏛️ Architecture",e:"🌏",q:"Can the Great Wall of China really be seen from space?",a:"Total myth! Chinese astronaut Yang Liwei confirmed in 2003 he couldn't see it. It's too narrow — about the width of a highway."},
  {w:"🏛️ Architecture",e:"⛪",q:"When did Sagrada Família finally get its building permit?",a:"2019 — 137 years after construction started in 1882! It still isn't finished and likely won't be until 2026."},
  {w:"🏛️ Architecture",e:"🪨",q:"How long was ancient Petra hidden from the Western world?",a:"Over 1,000 years! The rose-red rock city was only rediscovered by Swiss explorer Johann Burckhardt in 1812."},
  {w:"🏛️ Architecture",e:"🏗️",q:"How long did the Leaning Tower of Pisa take to build?",a:"199 years (1173–1372)! The lean actually started during construction due to soft ground on one side — and they just kept building."},
  {w:"🏛️ Architecture",e:"🏟️",q:"What unusual event did the Roman Colosseum host?",a:"Mock naval battles! The entire arena could be flooded with water for 'naumachiae' — real ship combat shows for 80,000 spectators."},
  /* Week 3 · Space 🚀 */
  {w:"🚀 Space & Universe",e:"🪐",q:"On Venus, which is longer — a day or a year?",a:"A day! Venus rotates so slowly that one Venusian day (243 Earth days) is longer than its whole year (225 Earth days)."},
  {w:"🚀 Space & Universe",e:"☀️",q:"What percentage of our solar system's mass is just the Sun?",a:"99.86%! All planets, moons, asteroids, and comets combined make up just 0.14%."},
  {w:"🚀 Space & Universe",e:"👣",q:"How long will Neil Armstrong's Moon footprints last?",a:"About 100 million years. No wind, no rain, no erosion on the Moon — they're still perfectly intact right now."},
  {w:"🚀 Space & Universe",e:"⭐",q:"Stars in the universe vs grains of sand on Earth — which is more?",a:"Stars! There are roughly 10²⁴ stars — more than every grain of sand on every beach and desert on Earth."},

function getDate(n){const d=new Date(START);d.setDate(d.getDate()+(n-1));return d;}
function isSun(n){return getDate(n).getDay()===0;}
function fmtLong(n){return getDate(n).toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});}
function fmtShort(n){return getDate(n).toLocaleDateString("en-IN",{day:"numeric",month:"short"});}

function getTasks(n){
  const t=[
    {id:"wake",    icon:"🌅",label:"Wake Up",       sub:"7–8 AM",              cat:"schedule"},
    {id:"sleep",   icon:"🌙",label:"Wind Down",      sub:"Sleep by 12–1 AM",    cat:"schedule"},
    {id:"meal1",   icon:"🍳",label:"Breakfast",                                 cat:"meals",isMeal:true},
    {id:"meal2",   icon:"🥗",label:"Lunch",                                     cat:"meals",isMeal:true},
    {id:"meal3",   icon:"🍲",label:"Dinner",                                    cat:"meals",isMeal:true},
    {id:"reading", icon:"📖",label:"Read",           sub:"5 pages minimum",     cat:"mind"},
    {id:"writing", icon:"✏️",label:"Write",          sub:"4–5 key points",      cat:"mind"},
    {id:"exercise",icon:"🏃",label:"Move Your Body", sub:"any exercise counts", cat:"body"},
  ];
  if(isSun(n))   t.push({id:"skincare",icon:"✨",label:"Sunday Skin Ritual",sub:"full routine",     cat:"beauty",isSC:true});
  if(OIL.has(n)) t.push({id:"oiling",  icon:"💧",label:"Hair Oiling",       sub:"nourish your scalp",cat:"beauty",isOil:true});
  if(WASH.has(n))t.push({id:"hairwash",icon:"🚿",label:"Hair Wash",          sub:"post-oil cleanse",  cat:"beauty",isWash:true});
  return t;
}

function getCurDay(){
  const now=new Date();now.setHours(0,0,0,0);
  const st=new Date(START);st.setHours(0,0,0,0);
  return Math.floor((now-st)/86400000)+1;
}

function calcOldStats(old){
  if(!old)return null;
  const OS=new Date("2026-05-25T00:00:00");
  const OO=new Set([1,4,7,10,13,16,19]),OW=new Set([2,5,8,11,14,17,20]);
  let done=0,possible=0,perf=0,cur=0,bestS=0;
  for(let d=1;d<=21;d++){
    const dd=new Date(OS);dd.setDate(dd.getDate()+d-1);
    let dm=8;if(dd.getDay()===0)dm++;if(OO.has(d))dm++;if(OW.has(d))dm++;
    const s=old[d]?.tasks||{};
    const dc=Object.keys(s).filter(id=>s[id]?.done).length;
    possible+=dm;done+=dc;
    const p=dm>0?dc/dm:0;
    if(p>=0.9)perf++;
    if(p>=0.6){cur++;bestS=Math.max(bestS,cur);}else cur=0;
  }
  return possible>0?{done,total:possible,pct:Math.round(done/possible*100),perf,streak:bestS}:null;
}

function getWeekRange(wk){return{start:(wk-1)*7+1,end:Math.min(wk*7,DAYS)};}
function calcWeekPts(data,wk){
  const{start,end}=getWeekRange(wk);
  let earned=0,max=0;
  for(let d=start;d<=end;d++){
    const tasks=getTasks(d),s=data[d]?.tasks||{};
    max+=tasks.length*10;
    earned+=tasks.filter(t=>s[t.id]?.done).length*10;
  }
  return{earned,max,pct:max>0?earned/max:0};
}

    }catch{}
    setLoaded(true);
  },[]);

  useEffect(()=>{if(!loaded)return;try{localStorage.setItem(STORAGE,JSON.stringify(data));}catch{}},[data,loaded]);
  useEffect(()=>{if(!loaded)return;try{localStorage.setItem("w42_w",JSON.stringify(wishes));}catch{}},[wishes,loaded]);

  useEffect(()=>{
    if(!loaded||curDay<=0)return;
    const ms=MILES[display];
    if(ms&&!shownMRef.current[display]){
      shownMRef.current={...shownMRef.current,[display]:true};
      localStorage.setItem("w42_m",JSON.stringify(shownMRef.current));
      setCel({...ms,isMile:true});
    }
  },[display,loaded,curDay]);

  const showToast=useCallback((msg)=>{
    clearTimeout(tRef.current);
    setToast({msg,id:Date.now()});
    tRef.current=setTimeout(()=>setToast(null),2600);
  },[]);

  const toggle=useCallback((dn,tid)=>{
    setData(prev=>{
      const day=prev[dn]||{tasks:{}};
      const tasks={...(day.tasks||{})};
      const was=!!tasks[tid]?.done;
      tasks[tid]={...tasks[tid],done:!was};
      if(!was){
        const msgs=TOASTS[tid]||TOASTS.def;
        showToast(msgs[Math.floor(Math.random()*msgs.length)]);
        const all=getTasks(dn);
        const dc=all.filter(t=>tasks[t.id]?.done).length;
        // GK fact unlocks at exactly 4 tasks done
        if(dc===4&&!shownGKRef.current[dn]&&GK[dn-1]){
          shownGKRef.current={...shownGKRef.current,[dn]:true};
          localStorage.setItem("w42_gk",JSON.stringify(shownGKRef.current));
          clearTimeout(gkRef.current);
          gkRef.current=setTimeout(()=>setGkFact({...GK[dn-1],day:dn}),500);

          clearTimeout(cRef.current);
          cRef.current=setTimeout(()=>setCel({...CHAMPS[Math.floor(Math.random()*CHAMPS.length)],isChamp:true}),400);
        }
      }
      return{...prev,[dn]:{...day,tasks}};
    });
  },[showToast]);

  const upd=useCallback((dn,tid,f,v)=>{
    setData(prev=>{
      const day=prev[dn]||{tasks:{}};
      const tasks={...(day.tasks||{}),[tid]:{...(day.tasks?.[tid]||{}),[f]:v}};
      return{...prev,[dn]:{...day,tasks}};

    for(let d=1;d<=DAYS;d++){const t=getTasks(d),s=data[d]?.tasks||{};total+=t.length;done+=t.filter(tk=>s[tk.id]?.done).length;}
    return{done,total,pct:total>0?Math.round(done/total*100):0};
  })();

    let cur=0;
    for(let d=1;d<=Math.min(Math.max(curDay,0),DAYS);d++){
      const t=getTasks(d),s=data[d]?.tasks||{};

      if(p>=0.6)cur++;else if(d<curDay)cur=0;

  const greet=(()=>{const h=new Date().getHours();if(h<12)return"Good morning 🌸";if(h<17)return"Good afternoon ☀️";if(h<21)return"Good evening 🌙";return"Good night ✨";})();
  const jpct=Math.max(0,Math.min(100,(Math.max(curDay-1,0)/DAYS)*100));

  if(curDay>DAYS)return(
    <div className="app">
      <FinalReport data={data} oldData={oldData} dayComp={dayComp}/>

  );

  return(
    <div className="app">
      <header className="hdr">
        <div className="hdr-inner">
          <div>
            <p className="hdr-greet">{greet}</p>
            <h1 className="hdr-title">Wellness Journey ✦</h1>
            <p className="hdr-sub">
              {curDay<=0?"New cycle begins Jul 25 🌿":
               `Day ${curDay} of 42 · Your Upgrade 🚀`}
            </p>
          </div>
          <div className="hdr-badges">
            <div className="bdg bdg-s">🔥 {streak} streak</div>
            <div className="bdg bdg-p">{stat.pct}% done</div>
          </div>
        </div>
        <div className="hpb"><div className="hpf" style={{width:`${jpct}%`}}/></div>
        <div className="hpl"><span>Jul 25</span><span>Day 42 · Sep 4</span></div>
      </header>

          <button key={t.id} className={`nb${tab===t.id?" on":""}`} onClick={()=>setTab(t.id)}>
            <span className="ne">{t.e}</span><span>{t.l}</span>
          </button>
        ))}
      </nav>

      <main className="main">
        {tab==="today"&&<TodayView day={display} curDay={curDay} data={data} toggle={toggle} upd={upd} setVDay={setVDay}/>}
        {tab==="cal"  &&<CalView   curDay={curDay} dayComp={dayComp} onClick={(d)=>{setVDay(d);setTab("today");}}/>}

              if(task.isWash)return<WashCard key={task.id} task={task} s={s} onT={()=>toggle(day,task.id)} onU={(f,v)=>upd(day,task.id,f,v)}/>;
              return<TCard key={task.id} task={task} s={s} onT={()=>toggle(day,task.id)} onU={(f,v)=>upd(day,task.id,f,v)}/>;
            })}
          </div>
        ))
      )}
    </div>
  );
}

/* ── CALENDAR VIEW ── */
function CalView({curDay,dayComp,onClick}){
  const [hov,setHov]=useState(null);
  const startDow=getDate(1).getDay();
  const cells=[...Array(startDow).fill(null),...Array.from({length:DAYS},(_,i)=>i+1)];
  const cs=(d)=>{
    if(d>curDay&&curDay>0)return{bg:"#f2ede6",bd:"#e4ddd4",txt:"#c4b8ac"};
    const{pct}=dayComp(d);
    if(pct>=0.9)return{bg:"#d8eedf",bd:"#a8d4b4",txt:"#3d7a52"};
    if(pct>=0.6)return{bg:"#fdecd6",bd:"#e8c090",txt:"#7a4e1a"};
    if(pct>=0.3)return{bg:"#fde4d4",bd:"#e8b098",txt:"#7a3818"};
    if(pct>0)   return{bg:"#fce0e8",bd:"#e8a8bc",txt:"#7a2840"};
    return{bg:"#fce8e8",bd:"#e0b4b4",txt:"#9a5050"};
  };
  const sum=Array.from({length:DAYS},(_,i)=>i+1).filter(d=>d<=Math.max(curDay,0))
    .reduce((a,d)=>{const p=dayComp(d).pct;if(p>=0.9)a.g++;else if(p>=0.6)a.ok++;else a.b++;return a;},{g:0,ok:0,b:0});
  return(
    <div className="ani">
      <h2 className="stl">42-Day Journey Map</h2>
      <div className="leg">
        {[{c:"#d8eedf",l:"90%+"},{c:"#fdecd6",l:"60%+"},{c:"#fde4d4",l:"30%+"},{c:"#fce0e8",l:"Some"},{c:"#fce8e8",l:"Missed"},{c:"#f2ede6",l:"Upcoming"}]
          .map(x=><div key={x.l} className="li"><div className="ld" style={{background:x.c}}/><span>{x.l}</span></div>)}
      </div>
      <div className="cg">
        {DOW.map((d,i)=><div key={i} className="ch">{d}</div>)}
        {cells.map((d,i)=>{
          if(!d)return<div key={`e${i}`} className="ce"/>;
          const{done,total,pct}=dayComp(d),c=cs(d),isNow=d===curDay&&curDay>0;
          const date=getDate(d),can=d<=Math.max(curDay,1);
          const sp=[];if(isSun(d))sp.push("✨");if(OIL.has(d))sp.push("💧");if(WASH.has(d))sp.push("🚿");
          return(
            <div key={d} className={`cc${isNow?" cnow":""}${can?" clk":""}`}
              style={{background:c.bg,borderColor:isNow?"#6d9e84":c.bd,borderWidth:isNow?2:1,color:c.txt,fontFamily:"'Poppins',sans-serif"}}
              onClick={()=>can&&onClick(d)} onMouseEnter={()=>setHov(d)} onMouseLeave={()=>setHov(null)}>
              <span className="cdn">{d}</span>
              <span style={{fontSize:7,opacity:.65}}>{DOW[date.getDay()]}</span>
              {d<=Math.max(curDay,0)?<span style={{fontSize:8}}>{done}/{total}</span>:<span style={{fontSize:8}}>—</span>}
              {isNow&&<span className="cnd"/>}
              {sp.length>0&&<div style={{display:"flex",gap:1,justifyContent:"center"}}>{sp.map((s,i)=><span key={i} style={{fontSize:7}}>{s}</span>)}</div>}
              {pct>0&&pct<1&&d<=curDay&&<div className="cmb"><div className="cmf" style={{width:`${pct*100}%`,background:c.bd}}/></div>}
            </div>
          );
        })}
      </div>
      {hov&&(
        <div className="ctip">
          <strong>Day {hov}</strong> — {fmtLong(hov)}
          {isSun(hov)&&" · ✨ Skincare"}{OIL.has(hov)&&" · 💧 Oil"}{WASH.has(hov)&&" · 🚿 Wash"}
          {hov<=Math.max(curDay,0)&&` · ${dayComp(hov).done}/${dayComp(hov).total} done`}
        </div>
      )}
      <div className="csum">
        {[{v:sum.g,l:"Champion",c:"#3d7a52"},{v:sum.ok,l:"Good Days",c:"#c07a50"},{v:sum.b,l:"To Improve",c:"#c06888"}]
          .map(x=><div key={x.l} className="si"><span className="sn" style={{color:x.c}}>{x.v}</span><span className="sl">{x.l}</span></div>)}
      </div>
    </div>
  );
}

          type="text"

/* ── PROGRESS VIEW ── */
function ProgView({data,oldData,curDay,stat,streak,dayComp,wishes,onSetWish}){
  const logged=Math.max(0,Math.min(Math.max(curDay,0),DAYS));
  const catS={};
  for(let d=1;d<=logged;d++){getTasks(d).forEach(t=>{catS[t.cat]=catS[t.cat]||{done:0,total:0};catS[t.cat].total++;if(data[d]?.tasks?.[t.id]?.done)catS[t.cat].done++;});}
  const tmap={};
  for(let d=1;d<=logged;d++){getTasks(d).forEach(t=>{tmap[t.id]=tmap[t.id]||{label:t.label,icon:t.icon,done:0,total:0};tmap[t.id].total++;if(data[d]?.tasks?.[t.id]?.done)tmap[t.id].done++;});}
  const allT=Object.values(tmap).filter(t=>t.total>0);
  const best=[...allT].sort((a,b)=>(b.done/b.total)-(a.done/a.total)).slice(0,4);
  const needs=[...allT].filter(t=>t.done<t.total).sort((a,b)=>(a.done/a.total)-(b.done/b.total)).slice(0,3);
  const perf=Array.from({length:logged},(_,i)=>i+1).filter(d=>{const{done,total}=dayComp(d);return total>0&&done===total;}).length;
  const hc=stat.pct>=70?"#6d9e84":stat.pct>=40?"#c07a50":"#c06888";
  const oldStats=calcOldStats(oldData);

  return(
    <div className="ani pv">
      {/* Hero */}
      <div className="ph">
        <div className="pb2" style={{color:hc}}>{stat.pct}%</div>
        <p className="psub">overall this cycle</p>
        <div className="phr">
          {[{v:streak,l:"Streak",i:"🔥"},{v:perf,l:"Perfect Days",i:"🌟"},{v:`${stat.done}/${stat.total}`,l:"Tasks Done",i:"✓"}]

      {/* Wish Jar */}
      {curDay>0&&<WishJar data={data} curDay={curDay} wishes={wishes} onSetWish={onSetWish}/>}

      {/* Previous journey */}
      {oldStats&&(
        <div className="pcard prev-card">
          <p className="pct">📜 Previous Journey — May 25 to Jun 14</p>
          <div className="prev-row">
            {[{v:`${oldStats.pct}%`,l:"Completion",c:"#8878c0"},{v:oldStats.perf,l:"Perfect Days",c:"#c07a50"},{v:oldStats.streak,l:"Best Streak",c:"#6d9e84"},{v:oldStats.done,l:"Tasks Done",c:"#5090bc"}]
              .map(x=><div key={x.l} className="prev-stat"><span className="prev-num" style={{color:x.c}}>{x.v}</span><span className="prev-lbl">{x.l}</span></div>)}
          </div>
          <div className="prev-bar-bg"><div className="prev-bar-fill" style={{width:`${oldStats.pct}%`}}/></div>
          <p className="prev-note">
            {oldStats.pct>=70?"That foundation is built. Now we go deeper. 🚀":
             oldStats.pct>=50?"Good start last time. This cycle, let's level it up. ⚡":
             "A fresh chance to improve. This cycle is your upgrade. 🌱"}
          </p>
        </div>
      )}

      {/* Category breakdown */}
      <div className="pcard">
        <p className="pct">By Category</p>
        {Object.entries(catS).length===0
          ?<p style={{color:"#b0a89e",fontSize:13,textAlign:"center",padding:"12px 0"}}>Start logging habits to see your breakdown!</p>
          :Object.entries(catS).map(([cat,{done,total}])=>{
            const p=total?done/total*100:0;
            return(<div key={cat} className="crow"><span className="crl" style={{color:CATS[cat].color}}>{CATS[cat].label}</span><div className="cb"><div className="cbf" style={{width:`${p}%`,background:CATS[cat].color}}/></div><span className="cbp">{Math.round(p)}%</span></div>);

          );})}

      )}

      {needs.length>0&&(

            <div key={i} className="hr2"><span className="hi">{t.icon}</span><div className="hif"><span className="hl">{t.label}</span><div className="hb"><div className="hbf" style={{width:`${p}%`,background:"#c06888"}}/></div></div><span className="hpc">{p}%</span></div>

          <p className="nn">Progress, not perfection. Be gentle with yourself 🌸</p>

          <p style={{fontSize:13,color:"#9a9490",lineHeight:1.7}}>An upgrade. A chance to improve.<br/>Start Day 1 on July 25 and watch this page bloom.</p>

  );

        <div className="obg-gk"/>
        <div className="ocnt">
          <span className="gk-theme">{d.w}</span>
          <span className="gk-emoji">{d.e}</span>
          <p className="gk-day">Day {d.day} · 4 habits done — here's your reward! 🔑</p>
          <p className="gk-q">{d.q}</p>
          <div className="gk-div"/>
          <p className="gk-a">✅ {d.a}</p>
          <button className="obtn-gk" onClick={onClose}>Got it! Keep going →</button>
        </div>
      </div>
    </div>
  );
}

/* ── CELEBRATION POPUP ── */
function CelPopup({d,onClose}){
  const conf=["🌸","⭐","✨","🌟","💫","🎊","🌺","🎉"];
  return(
    <div className="ov" onClick={onClose}>
      <div className="ob" onClick={e=>e.stopPropagation()}>
        <div className="obg-cel"/>
        <div className="ocnt">
          <span style={{fontSize:52,marginBottom:10,display:"block"}}>{d.emoji||"🎉"}</span>
          <div style={{display:"flex",justifyContent:"space-around",marginBottom:12,fontSize:18}}>
            {conf.map((c,i)=><span key={i} style={{display:"inline-block",animation:`cf 1.2s ${i*0.08}s ease-in forwards`}}>{c}</span>)}
          </div>
          <h2 className="otl">{d.title}</h2>
          <p className="omsg">{d.msg}</p>
          <button className="obtn" onClick={onClose}>{d.isChamp?"Keep glowing! ✨":"Let's do this! →"}</button>
        </div>
      </div>
    </div>
  );
}

/* ── FINAL REPORT ── */
function FinalReport({data,oldData,dayComp}){
  let done=0,total=0,perf=0,bestS=0,cur=0;
  for(let d=1;d<=DAYS;d++){
    const t=getTasks(d),s=data[d]?.tasks||{};
    const dc=t.filter(tk=>s[tk.id]?.done).length;
    total+=t.length;done+=dc;
    const p=t.length?dc/t.length:0;
    if(p===1)perf++;
    if(p>=0.6){cur++;bestS=Math.max(bestS,cur);}else cur=0;
  }
  const pct=total>0?Math.round(done/total*100):0;
  const catS={};
  for(let d=1;d<=DAYS;d++){getTasks(d).forEach(t=>{catS[t.cat]=catS[t.cat]||{done:0,total:0,label:CATS[t.cat].label,color:CATS[t.cat].color};catS[t.cat].total++;if(data[d]?.tasks?.[t.id]?.done)catS[t.cat].done++;});}
  const topCat=Object.values(catS).sort((a,b)=>(b.done/b.total)-(a.done/a.total))[0];
  const hc=pct>=70?"#6d9e84":pct>=40?"#c07a50":"#c06888";
  const oldStats=calcOldStats(oldData);

  // Jar summary
  let jarsUnlocked=0;
  for(let w=1;w<=6;w++){const{pct:p}=calcWeekPts(data,w);if(p>=0.7)jarsUnlocked++;}

  return(
    <div className="fw">
      <div className="fh">
        <div style={{fontSize:60,marginBottom:12}}>👑</div>
        <h1 className="ft2">42 Days Complete!</h1>
        <p className="fs2">Six weeks of showing up, every single day.<br/>You are genuinely not the same person who started July 25. 🌟</p>
      </div>

      <div className="fsg">
        {[{v:`${pct}%`,l:"Overall",i:"🏆",c:hc},{v:perf,l:"Perfect Days",i:"🌟",c:"#8878c0"},
          {v:bestS,l:"Best Streak",i:"🔥",c:"#c07a50"},{v:`${jarsUnlocked}/6`,l:"Jars Unlocked",i:"🫙",c:"#6d9e84"}]
          .map(x=><div key={x.l} className="fsc"><div style={{fontSize:22,marginBottom:4}}>{x.i}</div><div className="fsn" style={{color:x.c}}>{x.v}</div><div className="fsl">{x.l}</div></div>)}
      </div>

      {oldStats&&(
        <div className="pcard" style={{marginBottom:12}}>
          <p className="pct">📈 Cycle 1 vs Cycle 2 — Your Growth</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            <div style={{background:"#ede9f8",borderRadius:12,padding:14,textAlign:"center",border:"1px solid #c8b8e0"}}>
              <div style={{fontSize:26,fontWeight:800,color:"#8878c0"}}>{oldStats.pct}%</div>
              <div style={{fontSize:11,color:"#8878c0",marginTop:4}}>🌱 Cycle 1<br/>May 25 – Jun 14</div>
            </div>
            <div style={{background:"#eaf4ee",borderRadius:12,padding:14,textAlign:"center",border:"1px solid #a8d4b4"}}>
              <div style={{fontSize:26,fontWeight:800,color:"#6d9e84"}}>{pct}%</div>
              <div style={{fontSize:11,color:"#6d9e84",marginTop:4}}>🚀 Cycle 2<br/>Jul 25 – Sep 4</div>
            </div>
          </div>
          <p style={{fontSize:12,color:"#6e6860",textAlign:"center",fontStyle:"italic"}}>
            {pct>oldStats.pct?`Improved by ${pct-oldStats.pct}% from your first cycle. That's real growth. 🌱`:
             pct===oldStats.pct?"Consistent across both cycles. Solid and steady. 💪":
             "Every journey teaches something. You showed up — that's everything. 🌸"}
          </p>
        </div>
      )}

      <div className="pcard" style={{marginBottom:12}}>
        <p className="pct">📊 Category Results</p>
        {Object.values(catS).map(cat=>{const p=cat.total?cat.done/cat.total*100:0;return(
          <div key={cat.label} className="crow"><span className="crl" style={{color:cat.color}}>{cat.label}</span><div className="cb"><div className="cbf" style={{width:`${p}%`,background:cat.color}}/></div><span className="cbp">{Math.round(p)}%</span></div>
        );})}
        {topCat&&<p style={{fontSize:12,color:"#6d9e84",fontWeight:600,textAlign:"center",marginTop:10}}>🏅 Best: {topCat.label} ({Math.round(topCat.done/topCat.total*100)}%)</p>}
      </div>

      <div className="pcard" style={{textAlign:"center",padding:"24px 20px",background:"linear-gradient(135deg,#eaf4ee,#ede8f8)",borderColor:"#c8c0e0",marginBottom:12}}>
        <div style={{fontSize:36,marginBottom:10}}>🌸</div>
        <p style={{fontSize:15,fontWeight:700,color:"#2e2a28",marginBottom:10}}>What you built in 42 days:</p>
        <p style={{fontSize:13,color:"#6e6860",lineHeight:1.9}}>A body that moves · A mind that reads<br/>A pen that writes · Skin that glows<br/>Hair that's nourished · Meals that fuel you<br/>A sleep rhythm · A morning ritual</p>
        <p style={{fontSize:14,fontWeight:700,color:"#8878c0",marginTop:16}}>That's not a tracker. That's a new you. 🌟</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
